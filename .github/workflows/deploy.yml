name: CI e Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nenhuma permissão por padrão; cada job declara só o que precisa.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js (versão exata do .nvmrc)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm # só o cache de downloads do npm, não o node_modules

      - name: Instalar dependências (estritamente pelo lockfile)
        run: npm ci

      - name: Instalar o Chromium do Playwright (navegador, não dependência npm)
        run: npx playwright install --with-deps chromium

      - name: Validar e construir (testes de navegador e portão de release incluídos)
        run: npm run ci:build

      - name: Enviar o artefato do Pages (exatamente o dist/ validado)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Alerta de disponibilidade (não substitui a validação manual)
        run: >-
          curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors
          "${{ steps.deployment.outputs.page_url }}"
